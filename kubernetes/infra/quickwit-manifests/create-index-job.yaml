apiVersion: batch/v1
kind: Job
metadata:
  name: quickwit-create-index
  namespace: monitoring
spec:
  ttlSecondsAfterFinished: 300  # Clean up after 5 minutes
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-index
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Quickwit to be ready..."

              # Wait for Quickwit service to be available
              until curl -f http://quickwit-searcher.monitoring.svc.cluster.local:7280/health/livez 2>/dev/null; do
                echo "Waiting for Quickwit..."
                sleep 5
              done

              echo "Quickwit is ready!"
              echo "Creating logs index..."

              # Create the index using the API
              curl -X POST "http://quickwit-searcher.monitoring.svc.cluster.local:7280/api/v1/indexes" \
                -H "Content-Type: application/yaml" \
                --data-binary @- <<'EOF'
              version: 0.8
              index_id: logs
              doc_mapping:
                field_mappings:
                  - name: timestamp
                    type: datetime
                    input_formats:
                      - rfc3339
                      - unix_timestamp
                    output_format: rfc3339
                    fast: true
                  - name: level
                    type: text
                    tokenizer: raw
                    fast: true
                  - name: message
                    type: text
                    tokenizer: default
                    record: position
                    stored: true
                  - name: namespace
                    type: text
                    tokenizer: raw
                    fast: true
                  - name: pod_name
                    type: text
                    tokenizer: raw
                    fast: true
                  - name: container_name
                    type: text
                    tokenizer: raw
                    fast: true
                  - name: node_name
                    type: text
                    tokenizer: raw
                    fast: true
                  - name: cluster
                    type: text
                    tokenizer: raw
                    fast: true
                timestamp_field: timestamp
              indexing_settings:
                commit_timeout_secs: 60
              search_settings:
                default_search_fields:
                  - message
                  - namespace
                  - pod_name
              EOF

              echo "Index creation completed!"
