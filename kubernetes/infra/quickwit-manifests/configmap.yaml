apiVersion: v1
kind: ConfigMap
metadata:
  name: quickwit-config
  namespace: monitoring
data:
  quickwit.yaml: |
    version: 0.8
    cluster_id: homelab-cluster
    node_id: ${QW_NODE_ID}

    listen_address: 0.0.0.0
    rest_listen_port: 7280

    metastore_uri: ${QW_DATA_DIR}/metastore
    data_dir: ${QW_DATA_DIR}

    indexer:
      enable_otlp_endpoint: false

    searcher:
      fast_field_cache_capacity: 1GB
      split_footer_cache_capacity: 500MB

    ingest_api:
      max_queue_memory_usage: 2GiB
      max_queue_disk_usage: 4GiB

  index-config.yaml: |
    version: 0.8

    index_id: logs

    doc_mapping:
      field_mappings:
        - name: timestamp
          type: datetime
          input_formats:
            - rfc3339
            - unix_timestamp
          output_format: rfc3339
          fast: true

        - name: level
          type: text
          tokenizer: raw
          fast: true

        - name: message
          type: text
          tokenizer: default
          record: position
          stored: true

        - name: namespace
          type: text
          tokenizer: raw
          fast: true

        - name: pod_name
          type: text
          tokenizer: raw
          fast: true

        - name: container_name
          type: text
          tokenizer: raw
          fast: true

        - name: node_name
          type: text
          tokenizer: raw
          fast: true

        - name: cluster
          type: text
          tokenizer: raw
          fast: true

      timestamp_field: timestamp

    indexing_settings:
      commit_timeout_secs: 60
      merge_policy:
        type: stable_log
        merge_factor: 10
        max_merge_factor: 12

    search_settings:
      default_search_fields:
        - message
        - namespace
        - pod_name
        - container_name
