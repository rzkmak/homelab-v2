apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit
  namespace: monitoring
  labels:
    app: quickwit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickwit
  template:
    metadata:
      labels:
        app: quickwit
    spec:
      initContainers:
        - name: init-quickwit
          image: quickwit/quickwit:0.8.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Initializing Quickwit..."

              # Create index if it doesn't exist
              if [ ! -f ${QW_DATA_DIR}/indexes/logs ]; then
                echo "Creating logs index..."
                quickwit index create --index-config /quickwit/config/index-config.yaml
              else
                echo "Logs index already exists"
              fi
          env:
            - name: QW_DATA_DIR
              value: /quickwit/data
            - name: QW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /quickwit/data
            - name: config
              mountPath: /quickwit/config
      containers:
        - name: quickwit
          image: quickwit/quickwit:0.8.1
          command:
            - quickwit
            - run
          ports:
            - name: rest
              containerPort: 7280
              protocol: TCP
            - name: grpc
              containerPort: 7281
              protocol: TCP
          env:
            - name: QW_DATA_DIR
              value: /quickwit/data
            - name: QW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: QW_LISTEN_ADDRESS
              value: "0.0.0.0"
          volumeMounts:
            - name: data
              mountPath: /quickwit/data
            - name: config
              mountPath: /quickwit/config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health/livez
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readyz
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quickwit-data
        - name: config
          configMap:
            name: quickwit-config
