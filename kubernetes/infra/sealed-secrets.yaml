apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    chart: sealed-secrets
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    targetRevision: 2.15.0
    helm:
      releaseName: sealed-secrets
      values: |
        # Sealed Secrets Controller
        fullnameOverride: sealed-secrets-controller

        # Command line arguments for the controller
        commandArgs:
          - --update-status
          - --key-renew-period=720h

        # Resources
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi

        # Service account
        serviceAccount:
          create: true
          name: sealed-secrets-controller

        # RBAC
        rbac:
          create: true
          pspEnabled: false

        # Metrics
        metrics:
          serviceMonitor:
            enabled: true
            namespace: kube-system
            labels:
              release: kube-prometheus-stack

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 65534
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 3m
